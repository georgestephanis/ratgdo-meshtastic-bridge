# ratgdo node logic: talks to the opener and speaks the GDO1 text protocol.
# Transport-neutral: it calls script mesh_send to send a line, and a transport
# package (transport-uart.yaml or transport-espnow.yaml) calls
# handle_mesh_line for each line received. Don't compile this directly; see
# garage-wired.yaml and garage-espnow.yaml.
#
# Message format (see README.md):
#   status   GDO1|door=closed|light=off|obst=clear|ev=change
#   command  GDO1!close   (sent by a node whose short name is allowed)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  on_boot:
    priority: -100
    then:
      - delay: 45s          # let the radio boot and ratgdo sync with the opener
      - script.execute:
          id: publish_status
          ev: boot


external_components:
  - source:
      type: git
      url: https://github.com/ratgdo/esphome-ratgdo
      ref: c11e9347b980d493421905613da4c7e502f886e2  # pinned (main @ 2026-10-16); bump deliberately after testing
    components: [ratgdo]
    refresh: 1d

preferences:
  flash_write_interval: 1min    # rolling code counter must survive reboots



switch:
  - platform: ratgdo
    id: gdo_learn
    ratgdo_id: gdo
    type: learn
    name: "Learn"
    entity_category: config

ratgdo:
  id: gdo
  input_gdo_pin: ${uart_rx_pin}
  output_gdo_pin: ${uart_tx_pin}
  input_obst_pin: ${input_obst_pin}
  obst_sleep_low: true          # as upstream's v2.5 ESP32 board; try false if obstruction reads wrong
  on_sync_failed:
    then:
      - script.execute:
          id: publish_status
          ev: sync_failed

cover:
  - platform: ratgdo
    id: gdo_door
    ratgdo_id: gdo
    device_class: garage
    name: "Door"
    on_state_change:
      - script.execute:
          id: publish_status
          ev: change

light:
  - platform: ratgdo
    id: gdo_light
    ratgdo_id: gdo
    name: "Light"
    on_turn_on:
      - script.execute:
          id: publish_status
          ev: change
    on_turn_off:
      - script.execute:
          id: publish_status
          ev: change

binary_sensor:
  - platform: ratgdo
    type: obstruction
    id: gdo_obstruction
    ratgdo_id: gdo
    name: "Obstruction"
    device_class: problem
    on_state:
      - script.execute:
          id: publish_status
          ev: change
  - platform: ratgdo
    type: motion
    id: gdo_motion
    ratgdo_id: gdo
    name: "Motion"
    device_class: motion

# These hold the Security+ 2.0 rolling code and client ID in flash. Required:
# without them the opener stops accepting commands after a reboot.
number:
  - platform: ratgdo
    id: gdo_rolling_code_counter
    ratgdo_id: gdo
    type: rolling_code_counter
    name: "Rolling code counter"
    entity_category: config
    mode: box
  - platform: ratgdo
    id: gdo_client_id
    ratgdo_id: gdo
    type: client_id
    name: "Client ID"
    entity_category: config
    mode: box
  - platform: ratgdo
    id: gdo_opening_duration
    ratgdo_id: gdo
    type: opening_duration
    name: "Opening duration"
    entity_category: config
  - platform: ratgdo
    id: gdo_closing_duration
    ratgdo_id: gdo
    type: closing_duration
    name: "Closing duration"
    entity_category: config

text_sensor:
  - platform: template
    id: last_mesh_command
    name: "Last mesh command"
    entity_category: diagnostic

script:
  # Builds one status line and hands it to the transport, which gets it to
  # the radio for broadcast on its primary channel. mode: restart + a short delay coalesces bursts (opening -> open,
  # light + door together) into one message to save airtime.
  - id: publish_status
    mode: restart
    parameters:
      ev: string
    then:
      - delay: 3s
      - script.execute:
          id: mesh_send
          line: !lambda |-
            std::string door;
            auto op = id(gdo_door).current_operation;
            float pos = id(gdo_door).position;
            if (op == COVER_OPERATION_OPENING) door = "opening";
            else if (op == COVER_OPERATION_CLOSING) door = "closing";
            else if (pos >= 0.99f) door = "open";
            else if (pos <= 0.01f) door = "closed";
            else door = "stopped";
            std::string light = id(gdo_light).remote_values.is_on() ? "on" : "off";
            std::string obst = id(gdo_obstruction).state ? "blocked" : "clear";
            std::string msg = std::string("${gdo_tag}|door=") + door + "|light=" + light +
                              "|obst=" + obst + "|ev=" + ev;
            ESP_LOGI("mesh", "TX %s", msg.c_str());
            return msg;

  - id: handle_mesh_line
    mode: queued
    max_runs: 5
    parameters:
      line: string
    then:
      - lambda: |-
          // The radio prints incoming texts as "<short name>: <text>".
          auto sep = line.find(": ");
          if (sep == std::string::npos) return;
          std::string sender = line.substr(0, sep);
          std::string body = line.substr(sep + 2);
          const std::string prefix = "${gdo_tag}!";
          if (body.rfind(prefix, 0) != 0) return;   // not for us
          std::string cmd = body.substr(prefix.size());
          while (!cmd.empty() && (cmd.back() == ' ' || cmd.back() == '\r')) cmd.pop_back();

          // "status" only reads, so anyone on the channel (or the hub's own
          // test button) may ask; everything else needs an allowed sender.
          const std::string allowed = ",${allowed_senders},";
          if (cmd != "status" && allowed.find("," + sender + ",") == std::string::npos) {
            ESP_LOGW("mesh", "ignored '%s' from unlisted sender '%s'", cmd.c_str(), sender.c_str());
            id(last_mesh_command).publish_state(sender + ": " + cmd + " (denied)");
            return;
          }
          id(last_mesh_command).publish_state(sender + ": " + cmd);
          ESP_LOGI("mesh", "command '%s' from %s", cmd.c_str(), sender.c_str());

          if (cmd == "close") {
            id(gdo_door).make_call().set_command_close().perform();
          } else if (cmd == "open") {
            if (std::string("${allow_open}") != "true") {
              ESP_LOGW("mesh", "open over mesh is disabled (allow_open)");
              id(publish_status).execute(std::string("denied_open"));
              return;
            }
            id(gdo_door).make_call().set_command_open().perform();
          } else if (cmd == "stop") {
            id(gdo_door).make_call().set_command_stop().perform();
          } else if (cmd == "light_on") {
            id(gdo_light).turn_on().perform();
          } else if (cmd == "light_off") {
            id(gdo_light).turn_off().perform();
          } else if (cmd != "status") {
            id(publish_status).execute(std::string("unknown_cmd"));
            return;
          }
          // Acknowledge with fresh status; state changes also publish on
          // their own, and mode: restart folds them into one message.
          id(publish_status).execute(std::string("ack_") + cmd);

interval:
  - interval: ${heartbeat_interval}
    then:
      - script.execute:
          id: publish_status
          ev: heartbeat

button:
  - platform: restart
    name: "Restart"
  - platform: template
    name: "Send status to mesh"
    on_press:
      - script.execute:
          id: publish_status
          ev: manual
