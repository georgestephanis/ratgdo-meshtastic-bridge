# Seeed XIAO ESP32-C6 build of the ratgdo + Meshtastic bridge.
#   uvx esphome run xiao-esp32c6.yaml

substitutions:
  # --- bridge behaviour (override in your board file if you like) ---
  name: garage-mesh-bridge
  friendly_name: "Garage"
  # Tag that prefixes every message for this opener. Keep it short (airtime).
  gdo_tag: "GDO1"
  # Meshtastic short names allowed to send commands, comma-separated, no spaces.
  allowed_senders: "HOMA,HOMB"
  # Accept "open" over the mesh? "close", "stop", "light_*" and "status" are
  # always accepted from allowed senders. Opening a garage remotely is the
  # risky direction, so it's off by default.
  allow_open: "false"
  # Periodic status even when nothing changes, so receivers can spot a dead link.
  heartbeat_interval: 6h
  mesh_baud: "9600"

  # --- opener wire bus (see docs/hardware.md); XIAO pin in brackets ---
  uart_tx_pin: GPIO1        # [D1] to the TX transistor/optocoupler
  uart_rx_pin: GPIO2        # [D2] from the RX optocoupler
  input_obst_pin: GPIO21    # [D3] obstruction sensor line
  # --- link to the Meshtastic radio's serial module (TEXTMSG mode) ---
  # Not D6/GPIO16 for TX: it's UART0 TX and the boot ROM prints there, which
  # the radio would broadcast as a text message.
  mesh_tx_pin: GPIO0        # [D0] -> radio serial RXD
  mesh_rx_pin: GPIO17       # [D7] <- radio serial TXD

packages:
  bridge: !include common.yaml

esp32:
  board: esp32-c6-devkitc-1   # generic C6 target; the XIAO C6 has 4 MB flash
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# Logs go to the C6's built-in USB serial/JTAG, so ESPHome gives the radio
# link UART0 and ratgdo keeps its hard-coded UART1.
logger:
  level: INFO

# RF switch: GPIO3 low = switch powered, GPIO14 low = onboard antenna
# (high = U.FL). Only matters for the maintenance access point.
switch:
  - platform: gpio
    pin: GPIO3
    id: rf_switch_power
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    pin: GPIO14
    id: antenna_select
    restore_mode: ALWAYS_OFF
    internal: true
