<text x="754" y="424" class="pt" text-anchor="start">Notes</text>
<text x="754" y="442" class="ps" text-anchor="start"></text>
<text x="754" y="444" class="nt" text-anchor="start">• Same-named flags are one net. In EasyEDA</text>
<text x="754" y="463" class="nt" text-anchor="start">  use Net Labels or Net Ports with these names.</text>
<text x="754" y="482" class="nt" text-anchor="start">• WHITE is ground: opener GND = ESP32 GND.</text>
<text x="754" y="501" class="nt" text-anchor="start">• BC337 TO-92 pins: 1 = C, 2 = B, 3 = E.</text>
<text x="754" y="520" class="nt" text-anchor="start">  Flat face toward you, legs down: C B E.</text>
<text x="754" y="539" class="nt" text-anchor="start">• SMD BC817 (SOT-23) is a drop-in but its</text>
<text x="754" y="558" class="nt" text-anchor="start">  pins differ: 1 = B, 2 = E, 3 = C.</text>
<text x="754" y="577" class="nt" text-anchor="start">• ESP32 GPIOs: TX/RX/OBST map to uart_tx_pin,</text>
<text x="754" y="596" class="nt" text-anchor="start">  uart_rx_pin, input_obst_pin in the firmware.</text>
<text x="754" y="615" class="warn" text-anchor="start">• ⚠ Untested values. Bench-test first.</text>
</svg>
